          type: integer
        headline:
          type: string
        subheadline:
          type: string
          nullable: true
        accentWord:
          type: string
          nullable: true
        style:
          type: string
        format:
          type: string
        backgroundImageUrl:
          type: string
          nullable: true
        bgColor:
          type: string
          nullable: true
        posted:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - headline
        - style
        - format
        - posted
        - createdAt

    GenerateAdResponse:
      type: object
      properties:
        ad:
          $ref: "#/components/schemas/AdItem"
      required:
        - ad

    AdsListResponse:
      type: object
      properties:
        ads:
          type: array
          items:
            $ref: "#/components/schemas/AdItem"
      required:
        - ads

    CctStats:
      type: object
      properties:
        twitterPostsToday:
          type: integer
        twitterPostsTotal:
          type: integer
        instagramCarouselsToday:
          type: integer
        instagramCarouselsTotal:
          type: integer
        lastGeneratedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - twitterPostsToday
        - twitterPostsTotal
        - instagramCarouselsToday
        - instagramCarouselsTotal
        - lastGeneratedAt

    UsageData:
      type: object
      properties:
        totalTokens:
          type: integer
        instagramTokens:
          type: integer
        adgenTokens:
          type: integer
        twitterTokens:
          type: integer
        contentgenTokens:
          type: integer
        daily:
          type: array
          items:
            $ref: "#/components/schemas/UsageDailyEntry"
      required:
        - totalTokens
        - instagramTokens
        - adgenTokens
        - twitterTokens
        - contentgenTokens
        - daily

    UsageDailyEntry:
      type: object
      properties:
        date:
