        instagram:
          type: integer
        adgen:
          type: integer
        twitter:
          type: integer
        contentgen:
          type: integer
        total:
          type: integer
      required:
        - date
        - instagram
        - adgen
        - twitter
        - contentgen
        - total

    EngineNewsResponse:
      type: object
      properties:
        articles:
          type: array
